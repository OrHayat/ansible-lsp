# T-062: the YAML inventory shape — `all:` / `vars:` / `children:` / `hosts:`.
#
# The same variable names as inventory-prod.ini, with different values. That is the point:
# which inventory you run with decides what a variable *is*, and `-i` is invisible to an
# editor, so the tool asks rather than guesses.
#
# Format is detected from content, not from the extension — this could be called anything.

all:
  vars:
    # Applies to every host, whichever group.
    ntp_server: 192.168.1.1
  children:
    webservers:
      vars:
        app_tier: lab
        # NO HINT: this is where `ansible_group_priority` actually works. An inventory source
        # is *parsed*, and the parser consumes this key as merge order instead of storing it —
        # measured, it moves the winner between two same-depth groups, and it never appears as
        # a variable afterwards. The same key in group_vars/ is inert: see
        # inventories/prod/group_vars/all.yml.
        #
        # Our silence here is the top-level rule, not the directory one: a YAML inventory can
        # only carry this key nested under a group, and we read variables off a vars file's top
        # level. Right answer, and not for the reason the pairing suggests — so the directory
        # half is pinned by a synthetic case in the test instead.
        ansible_group_priority: 10
      hosts:
        web01:
          host_line_ip: 192.168.1.11
        web02:
          host_line_ip: 192.168.1.12
    db:
      hosts:
        db01:
          host_line_ip: 192.168.1.21
