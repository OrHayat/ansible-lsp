# Marks this folder as the project root, which is how `playbook_dir` and the role search
# path get their values. Without it the demo can't exercise either.
[defaults]
roles_path = ./roles:.
inventory = ./inventory-lab.yml
# Legacy controller-side plugin dir. A `foo:` task whose plugin lives here runs on the
# controller, shadowing any same-named module. Exercised by demo/tasks/action_plugins.yml.
action_plugins = ./plugins/action
