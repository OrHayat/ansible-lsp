---
# The `roles:` list form, both spellings.
- name: Demo play
  hosts: localhost
  roles:
    - demo              # bare string
    - role: demo        # dict form
    - no_such_role      # unresolvable, stays plain

# ---------------------------------------------------------- import_playbook
# Play-level, static. Resolved against this file's directory, then the project
# root — no roles_path, no collections.

- name: GOOD — imports a real playbook
  import_playbook: imported.yml

- name: BAD — no such playbook, warns
  import_playbook: not_here.yml

- name: BAD — templated, and this one warns unlike other templated paths
  # Expanded when THIS FILE is parsed — before any play, host or fact exists. Only
  # `-e` or a `vars:` on the entry can supply it; group_vars and set_fact cannot,
  # and the whole file then fails to parse (verified: exit 4, no PLAY banner).
  # So unlike other templated paths this one warns — not because it can never
  # resolve (with `-e env=prod` it runs fine) but because the file can't be
  # `--syntax-check`ed on its own.
  import_playbook: "{{ env }}-setup.yml"

- name: SILENCED — the same line, when you really do pass -e
  # The only person who knows whether `-e env=prod` is always passed is the author,
  # so the warning is suppressible and the message says so.
  import_playbook: "{{ env }}-setup.yml"  # noqa: templated-import

- name: BAD — templated from a definition that exists and cannot reach it (inert-import-var)
  # `deploy_stage` IS defined — group_vars/all.yml — and that definition is inert here:
  # group_vars apply per host, and this line is expanded before any host exists. The
  # second warning on this line names that file, which is otherwise the thing you stare
  # at. It does not say the run fails: `-e deploy_stage=prod` at launch would work, and
  # group_vars-as-default plus `-e`-as-override is an ordinary pattern. The definition
  # still never reaches this line.
  import_playbook: "{{ deploy_stage }}-setup.yml"

- name: GOOD — templated, but supplied right here
  # `vars:` on the import entry is `self.vars`, read before the variable manager is
  # consulted — one of the two things that works. Resolves and does not warn.
  import_playbook: "{{ target }}.yml"
  vars:
    target: imported

- name: GOOD — a magic variable needs no play, so it resolves
  # `playbook_dir` comes from `_get_magic_variables`, which needs no play or host.
  # This form passes `--syntax-check` with nothing passed at launch.
  import_playbook: "{{ playbook_dir }}/imported.yml"

- name: "GOOD — resolves; note what the when: actually does"
  # Ansible copies this condition onto EVERY task in EVERY play of the imported
  # playbook. It is not a single gate evaluated once.
  import_playbook: imported.yml
  when: not (skip_demo | default(false))

- name: SILENCED — bare noqa silences everything on the line
  import_playbook: also_not_here.yml  # noqa

- name: SILENCED — by rule id, the precise form
  import_playbook: still_not_here.yml  # noqa: missing-file

- name: NOT SILENCED — another tool's rule id leaves ours alone
  # This repo already carries `# noqa: command-instead-of-module` for ansible-lint;
  # those lines must not accidentally disable these checks.
  import_playbook: definitely_not_here.yml  

# ------------------------------------------------------- STATIC when: (inlay hints)
# Grey text appears to the RIGHT of these lines saying what a default run does.
# No squiggle, no Problems entry — it's derived info, not a complaint.
#
# If you see nothing: Cmd+Shift+P -> "Preferences: Open Settings (UI)" ->
# search `inlay hints` -> set Editor > Inlay Hints: Enabled to `on`.

- name: "The skip-flag pattern"
  import_playbook: imported.yml
  when: not (skip_demo | default(false) | bool)

- name: "Inverted default — same shape, opposite meaning"
  import_playbook: imported.yml
  when: enable_extras | default(true) | bool

- name: "Mutually exclusive pair, branch 1 — the default value satisfies it"
  import_playbook: imported.yml
  when: demo_mode | default('native') == 'native'

- name: "Mutually exclusive pair, branch 2 — same var, so these two can never both run"
  import_playbook: imported.yml
  when: demo_mode | default('native') == 'docker'

- name: "BAD — when-import-var-mutated: the import sets the variable it is gated on"
  # The one rule here that reads other files. mutating.yml does `set_fact: demo_done`,
  # so this condition flips partway through and the playbook half-executes. Found a
  import_playbook: mutating.yml
  when: not (demo_done | default(false) | bool)

- name: "Always — the condition has no effect, so the import is unconditional"
  import_playbook: imported.yml
  when: true

- name: "NO HINT — real logic, so it stays silent rather than guessing"
  # Most real-world conditions look like this. Refusing to answer is the
  # feature; a tree that guesses is the thing that got the call-hierarchy version
  # scrapped.
  import_playbook: imported.yml
  when: ansible_facts['os_family'] == 'RedHat' and groups['x'] | length > 0

- name: "Both clauses readable — listed together, ANDed"
  # This said "NO HINT — no single honest summary" until the clause-combining landed.
  # A stale label is the same class of problem as a wrong tooltip, so it is worth
  # noticing that the demo can rot independently of the code.
  import_playbook: imported.yml
  when:
    - not (skip_demo | default(false) | bool)
    - demo_mode | default('native') == 'docker'

- name: "What the import's when: does to the imported file"
  # Open imported_semantics.yml — the per-task copy, the AND with a task's own when:,
  # the skipped fact gathering, and the handler exclusion, each written out.
  import_playbook: imported_semantics.yml
  when: not (skip_demo | default(false) | bool)

- name: "never run"
  import_playbook: imported.yml
  when: false
  
- name: "always run"
  import_playbook: imported.yml
  when: true
