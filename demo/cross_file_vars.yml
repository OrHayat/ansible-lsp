---
# Cross-file variable go-to-definition. Cmd+click a {{ variable }} to jump to its
# definition even when it lives in another file:
#   - shared_endpoint   -> vars/shared.yml            (vars_files)
#   - provisioner_user  -> roles/provisioner/defaults/main.yml   (role defaults)
#   - provisioner_ready -> roles/provisioner/tasks/main.yml      (role set_fact)
#
# Only deterministic paths are followed — the vars_files path written below, and the role
# Ansible loads. Nothing is scanned or guessed, and inventory / -e stay out of scope.

- name: Cross-file variables demo
  hosts: localhost
  vars_files:
    - vars/shared.yml
  roles:
    - provisioner
  tasks:
    - name: A variable defined in vars/shared.yml
      ansible.builtin.debug:
        msg: "{{ shared_endpoint }} (timeout {{ shared_timeout }})"

    - name: A variable from the provisioner role's defaults
      ansible.builtin.debug:
        msg: "connecting as {{ provisioner_user }}"

    - name: A fact the provisioner role set — reachable because the role is included
      ansible.builtin.debug:
        msg: ready
      when: provisioner_ready | default(false)

    # deploy_region is defined at THREE levels — the honest showcase of host precedence:
    #   role default (2)   roles/provisioner/defaults/main.yml   = us-east-1
    #   group_vars/all (5) group_vars/all.yml                    = eu-west-1
    #   host_vars (10)     host_vars/localhost.yml               = ap-south-1
    # Hover lists all three ranked; host_vars wins by precedence and is marked effective —
    # but flagged host-scoped, because it only applies when the play targets `localhost`.
    # Verifying that would need the inventory, which isn't parsed. group_vars/host_vars here
    # ARE indexed because they sit next to the playbook (a fixed path); the same files kept
    # beside a separate inventory file would not be.
    - name: A variable layered across role default, group_vars and host_vars
      ansible.builtin.debug:
        msg: "deploying to {{ deploy_region }}"

    # http_port lives only in group_vars/webservers — a NAMED group. Hover shows
    # "group_vars · webservers.yml = 8080" and flags it host-scoped: it applies only to
    # hosts in the webservers group. This play targets localhost, so it wouldn't actually
    # apply at runtime — but it's a real definition, so go-to-def still takes you there.
    - name: A group-scoped variable — only for hosts in the webservers group
      ansible.builtin.debug:
        msg: "listening on {{ http_port }}"

    # TWO HOPS via a meta dependency: this playbook names only `provisioner`, whose
    # meta/main.yml depends on network-base — which runs first and defines these. The walk
    # follows playbook -> provisioner -> (meta dependency) -> network-base, so Cmd+click
    # lands in the dependency and `var-undefined` correctly stays quiet here. Since the
    # route is invisible from this file, hover adds a stack-trace line under the definition:
    # "required by provisioner — provisioner/meta/main.yml:<line>" (clickable); roles named
    # directly in this file get none. See dependency_chain.yml for depths 0-5.
    - name: A default from a role this playbook never names
      ansible.builtin.debug:
        msg: "mtu {{ network_mtu }}, ready: {{ network_ready | default(false) }}"
