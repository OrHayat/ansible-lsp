# T-062: an INI inventory, and a variable source in its own right.
#
# Nothing points at this file — `ansible.cfg` names no inventory, so a plain
# `ansible-playbook` here would read /etc/ansible/hosts and find nothing. It becomes live
# only when you choose it (Cmd+Shift+P -> "Ansible LSP: Select Inventory"), which is the
# editor's stand-in for `-i inventory-prod.ini`.
#
# Compare with inventory-lab.yml: same variable names, different values. Switching between
# them changes what hover shows, which is the whole reason the tool cannot just guess.

[webservers]
web01 host_line_ip=10.0.0.11
web02 host_line_ip=10.0.0.12

[db]
db01 host_line_ip=10.0.0.21

# A `[group:vars]` section — variables for every host in the group.
[webservers:vars]
ntp_server=10.0.0.1
app_tier=production
