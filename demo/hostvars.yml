---
# `hostvars` — one host reading ANOTHER host's variables.
#
# Two different things share the name. Keep them apart:
#
#   host_vars/web01.yml   a FILE holding web01's variables
#   hostvars['web01']     a runtime DICT for reading them from somewhere else
#
# The rule, measured on 2.21.2: `hostvars` is assembled without the play, so it sees only
# what belongs to the HOST — inventory, `group_vars/`, `host_vars/`, and facts
# (`set_fact`, `register`, `include_vars`). Anything belonging to the PLAY — play `vars:`,
# role vars, block/task vars — is invisible through it. Always, on every host.
#
#   ansible-playbook -i inventory.ini hostvars.yml -c local --limit web02

- name: hostvars demo
  hosts: all
  gather_facts: false
  vars:
    play_scoped: 8080
  tasks:
    # GOOD: `web01_ib_ip` is set in host_vars/web01.yml and nowhere else. It belongs to the
    # host, so hostvars sees it. Cmd+click the name to jump there; hover shows the value.
    #
    # BOTH names on this line are clickable, and they answer different questions:
    #   'web01'       -> host_vars/web01.yml   "where are this host's variables written"
    #   web01_ib_ip   -> the line that sets it "where does this value come from"
    # The host jump matches the key against the filename, so it needs no inventory. Which
    # groups web01 belongs to is a different question, and waits for T-062.
    - name: GOOD a host_vars value, read through hostvars
      ansible.builtin.debug:
        msg: "{{ hostvars['web01'].web01_ib_ip }}"

    # BAD (in Ansible — NOT FLAGGED here): `play_scoped` is six lines up, and this is
    # undefined anyway, because it belongs to the play and hostvars has no play. The fix is
    # to move the value somewhere the host owns — host_vars/, group_vars/, or a set_fact.
    #
    # We deliberately say nothing. The obvious rule — "every definition I can see is
    # play-scoped, so this is always undefined" — is a false claim while inventory is
    # unparsed (T-062): a name written in play `vars:` AND in the inventory reads fine
    # through hostvars, returning the inventory value. Measured. Warning here would fire on
    # working code, which costs more than staying quiet.
    #
    # Hover still declines on this token, and that part IS sound: whatever the inventory
    # holds, the play var is not what this read returns, so offering it would be a lie.
    - name: BAD a play var read through hostvars
      ansible.builtin.debug:
        msg: "{{ hostvars['web01'].play_scoped }}"

    # BAD: the same fault, at its sharpest. Same variable, same host, same task — the plain
    # read works and the hostvars read does not. Nothing about ordering or host selection
    # explains it; the two spellings consult different buckets.
    - name: BAD the same variable, two spellings, two answers
      ansible.builtin.debug:
        msg:
          - "direct           = {{ play_scoped }}"
          - "through hostvars = {{ hostvars[inventory_hostname].play_scoped }}" 
          - "not exists = {{ hostvars[inventory_hostname].not_exists }}"

    # NO HINT: the same silence, arrived at the other way. This name is defined nowhere we
    # can see, and it is the shape a real inventory uses. Warning on it cost 37 false
    # positives across the corpus, every one an inventory host var.
    #
    # So both rows above and this one are quiet, for one reason: until T-062 parses
    # inventories, we cannot tell "undefined" from "defined somewhere we cannot read".
    - name: NO HINT a name only the inventory could define
      ansible.builtin.debug:
        msg: "{{ hostvars['web01'].infiniband_ip }}"

    # BAD: there is no host `web0143`. ansible.cfg points at inventory-lab.yml, which
    # declares web01, web02 and db01 — so this is provably fatal, and the editor is the only
    # place it shows before the play reaches this task.
    #
    # Ansible's own message is why this earns an ERROR rather than a warning. Measured:
    #
    #   bad host      Error while resolving value for 'msg': hostvars['web0143']
    #   bad variable  ... object of type 'HostVarsVars' has no attribute 'infiniband_ip'
    #
    # The second names the missing thing. The first echoes your expression back and never
    # says "no such host", so a typo in a host name reads like a missing variable.
    #
    # Silent whenever the host list is not knowable — a dynamic inventory we decline to run,
    # any add_host in the file, or no inventory resolved at all — and never for localhost,
    # which hostvars conjures on demand.
    - name: BAD a host the inventory does not have
      ansible.builtin.debug:
        msg: "{{ hostvars['web0143'].infiniband_ip }}"
