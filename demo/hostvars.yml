---
# `hostvars` — reading ANOTHER host's variables.
#
# Do not confuse it with the `host_vars/` folder next door. Ansible named two different
# things almost the same:
#
#   host_vars/web01.yml   a FILE. Variables that apply to the host web01.
#   hostvars['web01']     a runtime DICT. Lets a task running on web02 read web01's data.
#
# The dict is how you template a config that has to name every member of a cluster —
# `{% for h in groups['webservers'] %}{{ hostvars[h].app_port }}{% endfor %}` — because a
# task otherwise only ever sees the host it is running on.
#
# The trap (T-104): hostvars is built with NO play and NO task. `HostVars.__getitem__`
# calls `get_vars(host=host)` without either (`vars/hostvars.py:44-57`), so it can see
# inventory, `group_vars/`, `host_vars/`, facts and `-e` — and can NEVER see play `vars:`,
# `vars_files:`, role defaults/vars/params, or block/task vars.
#
# That is structural, not timing: no ordering makes it work, and it holds for every host
# including the one you are already on. Measured on 2.21.2, where it fails with
#
#   object of type 'HostVarsVars' has no attribute 'play_scoped'
#
# — a message that names the internal bucket rather than the variable, and never mentions
# that the definition exists and is simply out of reach. That is the gap T-104 fills.
#
# Run it against the demo inventory to see both halves:
#   ansible-playbook -i inventory.ini hostvars.yml -c local --limit web02

- name: hostvars demo
  hosts: all
  gather_facts: false
  vars:
    play_scoped: 8080
  tasks:
    # GOOD: `host_vars/web01.yml` sets app_port = 8888, and host_vars is exactly the kind
    # of source hostvars CAN see. This is the mechanism working as intended — web02 reading
    # web01's value. Hover app_port for the full per-host picture (multi_host_vars.yml).
    - name: GOOD another host's host_vars, reached through hostvars
      ansible.builtin.debug:
        msg: "web01's app_port is {{ hostvars['web01'].app_port }}"

    # BAD: `play_scoped` is defined twelve lines up, and this is undefined anyway — play
    # vars are not in the bucket hostvars is built from. Every host, every run.
    #
    # NOT YET FLAGGED — T-104 is the ticket that makes this a diagnostic. Until it lands
    # the editor says nothing here, which is the whole reason the ticket is a P1: the
    # failure is silent in Ansible too.
    - name: BAD a play var read through hostvars is always undefined
      ansible.builtin.debug:
        msg: "{{ hostvars['web01'].play_scoped }}"

    # BAD: the sharpest spelling of the same fault. Same variable, same host, same task —
    # the direct read works and the hostvars read does not. Nothing about ordering or host
    # selection explains it; the two spellings simply consult different buckets.
    - name: BAD the same variable, same host, two spellings, two answers
      ansible.builtin.debug:
        msg:
          - "direct           = {{ play_scoped }}"
          - "through hostvars = {{ hostvars[inventory_hostname].play_scoped }}"

    # GOOD: the fix. Move the variable to a source hostvars can see — `group_vars/all.yml`
    # sets deploy_region, so it is reachable both ways. This is what the T-104 message will
    # have to suggest, so it is here as the control: the identical shape, one line up,
    # reading a source that works.
    - name: GOOD the same shape against a group_vars source — reachable both ways
      ansible.builtin.debug:
        msg: "{{ hostvars['web01'].deploy_region }} == {{ deploy_region }}"
