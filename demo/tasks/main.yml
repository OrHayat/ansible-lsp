---
# Demo file: open this and look at the colours.
#
# TEAL + dotted underline = resolves, Cmd+click jumps there.
# Plain text                = does not resolve (or isn't supported yet).
#
# Everything below is a real reference against this demo role, so you can see
# exactly what the server does and doesn't handle right now.

# ---------------------------------------------------------------- WORKS TODAY

- name: Sibling file, short key
  include_tasks: sibling.yml

- name: Sibling file, FQCN key (same thing, normalised)
  ansible.builtin.include_tasks: sibling.yml


- name: missing file
  ansible.builtin.include_tasks: missing.yml

- name: "Block form with an explicit file: parameter"
  ansible.builtin.include_tasks:
    file: sibling.yml

- name: import_tasks resolves the same way
  ansible.builtin.import_tasks: sibling.yml

- name: Nested subdirectory, relative to THIS role's tasks/ dir
  # The legacy plugin cannot resolve this one — it looks next to the current
  # file, which would be tasks/nested/nested/deep.yml.
  ansible.builtin.include_tasks: nested/deep.yml

# --------------------------------------------------------- DELIBERATELY PLAIN

- name: Typo — no such file, so no colour
  ansible.builtin.include_tasks: sibbling.yml

- name: Templated — target depends on a runtime variable, never coloured
  ansible.builtin.include_tasks: "{{ ap_protocol }}/validate.yml"

- name: Commented-out include below must NOT be coloured
  ansible.builtin.debug:
    msg: the next line is a comment, not code
  # ansible.builtin.include_tasks: sibling.yml

# ------------------------------------------------------------- ROLES (work now)

- name: Role by name
  ansible.builtin.include_role:
    name: demo

- name: Role with a specific tasks file
  ansible.builtin.include_role:
    name: demo
    tasks_from: sibling

- name: The flow form the legacy plugin gets wrong
  # Everything is on one line, so the legacy ±6-line scan can't pair tasks_from
  # with its name. Here they're siblings in one mapping node.
  ansible.builtin.include_role: { name: demo, tasks_from: sibling }

- name: Role that does not exist — warns
  ansible.builtin.include_role:
    name: no_such_role

- name: Role with no tasks/main.yml — silent, because tasks_from supplies the file
  # roles/cib-batch in the real repo is exactly this: begin/commit/abort.yml and
  # no main.yml. 16 working references depend on this not warning.
  ansible.builtin.include_role: { name: demo, tasks_from: sibling }

- name: "The roles: list form lives in demo/playbook.yml"
  ansible.builtin.debug:
    msg: open that file too

# ------------------------------------------------ TEMPLATED PATHS (never warn)
# The real target depends on a runtime variable, so these can only ever offer
# candidates. Cmd+click shows every file the pattern could reach.

- name: GOOD — globs to two real files (http_target/, ftp_target/)
  ansible.builtin.include_tasks: "{{ protocol }}_target/check.yml"

- name: GOOD — wildcard in the filename rather than the directory
  ansible.builtin.include_tasks: "nested/{{ which }}.yml"

- name: BAD — nothing on disk matches, but still no warning
  # A variable could expand to anything at runtime, so absence proves nothing.
  ansible.builtin.include_tasks: "{{ protocol }}_target/nope.yml"

- name: BAD — no literal text to anchor on, so deliberately matches nothing
  # "*.yml" would otherwise match every task file in the role.
  ansible.builtin.include_tasks: "{{ anything }}.yml"

# --------------------------------------------- when: — INLAY HINTS (grey, no squiggle)
# Derived info, shown to the right of the line. Nothing here is wrong.
# Not showing? Settings -> search `inlay hints` -> Editor > Inlay Hints: Enabled = on.

- name: "Skip-flag — 289 conditions in the real repo have this shape"
  ansible.builtin.include_tasks: sibling.yml
  when: not (skip_demo | default(false) | bool)

- name: "Inverted default"
  ansible.builtin.include_tasks: sibling.yml
  when: enable_extras | default(true) | bool

- name: "Membership test"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_protocol in ['http', 'ftp']

- name: "is defined — statically the interesting one"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_override is defined

- name: "Non-empty check"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_hosts | default('') | length > 0

- name: "NO HINT — real logic, so it declines to answer rather than guess"
  # 61% of the real repo's conditions look like this. Refusing is the feature.
  ansible.builtin.include_tasks: sibling.yml
  when: ansible_facts['os_family'] == 'RedHat' and demo_hosts | length > 0

# ------------------------------------- when: — WARNINGS (these can never work at all)
# Provably broken regardless of what any variable holds. Zero of these exist in
# ~/app/ansible today — it's clean — so they only appear here.

- name: "BAD — {{ }} inside when: double-evaluates"
  ansible.builtin.include_tasks: sibling.yml
  when: "{{ skip_demo == false }}"

- name: "BAD — item without a loop is always undefined"
  ansible.builtin.include_tasks: sibling.yml
  when: item.rc == 0

- name: "BAD — single = is assignment, a Jinja syntax error at runtime"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode = 'docker'

- name: "BAD — unbalanced parenthesis"
  ansible.builtin.include_tasks: sibling.yml
  when: not (skip_demo | default(false)

- name: "SILENCED — rule-scoped noqa works on these too"
  ansible.builtin.include_tasks: sibling.yml
  when: item.rc == 0  # noqa: when-item-without-loop

- name: "GOOD — item with a loop is fine, no warning"
  ansible.builtin.include_tasks: sibling.yml
  loop: [1, 2]
  when: item > 1
