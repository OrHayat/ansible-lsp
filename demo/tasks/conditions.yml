---
# `when:` analysis. Two separate things happen in this file:
#
#   GREY TEXT to the right of a line = an inlay hint. Derived info, nothing is wrong.
#   YELLOW SQUIGGLE on the when: value = a warning. That condition can never work.
#
# No hints showing? Settings -> search `inlay hints` -> Editor > Inlay Hints: Enabled = on.
#
# Every verdict the classifier can produce appears below exactly once, so this file is
# also the fixture that proves each one still works.

# =========================================================== INLAY HINTS — one per verdict
# Wording is "unless X is set" rather than "runs by default" on purpose: `default(D)`
# only tells us the value when X is UNSET. Whether it's set in group_vars, inventory or
# -e is not knowable from the condition, so claiming "by default" would overstate it.

- name: "UnlessSet — the skip-flag pattern, common in real repos"
  ansible.builtin.include_tasks: sibling.yml
  when: not (skip_demo | default(false) | bool)

- name: "OnlyIfSet — same shape without the `not`, so the flag has to be turned on"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_extra_feature | default(false) | bool

- name: "UnlessCleared — default(true), so it runs until you switch it off"
  ansible.builtin.include_tasks: sibling.yml
  when: enable_extras | default(true) | bool

- name: "WhenEquals, default matches — so this is the branch that runs untouched"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode | default('native') == 'native'

- name: "WhenEquals, default does not match — the alternative branch"
  # Together with the line above this is a mutually exclusive pair: same variable,
  # different literals, so they can never both run. `Verdict::excludes` computes that;
  # nothing consumes it yet (T-024).
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode | default('native') == 'docker'

- name: "WhenEquals negated — `!=` flips which side the change has to be on"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode | default('native') != 'native'

- name: "WhenIn — membership against a literal list"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_protocol in ['http', 'ftp']

- name: "WhenIn negated"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_protocol not in ['http', 'ftp']

- name: "RequiresDefined — statically the interesting one"
  # If demo_override is defined nowhere in the workspace, this branch can never be
  # taken. The workspace index that would prove it exists now (T-033), but a variable used
  # inside a condition is deliberately left out of the undefined report — guarding it is the
  # point — so nothing turns "defined nowhere" into "this branch is dead" yet.
  ansible.builtin.include_tasks: sibling.yml
  when: demo_override is defined

- name: "RequiresDefined negated"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_override is not defined

- name: "RequiresNonEmpty"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_hosts | default('') | length > 0

- name: "Always — a no-op condition, the mirror of `when: false`"
  # Worth surfacing because it reads as if it gates something and doesn't. Usually a
  # leftover from debugging.
  ansible.builtin.include_tasks: sibling.yml
  when: true

- name: "Never — a YAML boolean, so this task is dead code"
  # `false` here is a real YAML bool, not the string "false". It used to reach the
  # classifier as "Boolean(false)" and go unrecognised — pinned now by
  # `a_yaml_boolean_when_reaches_the_classifier`.
  ansible.builtin.include_tasks: sibling.yml
  when: false

# ============================================================= NO HINT — declining to answer
# Most real-world conditions land here. Refusing to answer is the feature:
# a guess in an execution tree is what got the call-hierarchy version scrapped.

- name: "NO HINT — real boolean logic"
  ansible.builtin.include_tasks: sibling.yml
  when: ansible_facts['os_family'] == 'RedHat' and demo_hosts | length > 0

- name: "NO HINT — unguarded comparison, so nothing is known about an unset run"
  # Without `| default(...)` there is no statement of what happens when the variable
  # is missing, and Ansible has 22 precedence levels we deliberately do not resolve.
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode == 'docker'

- name: "NO HINT — an unrecognised filter could change the result"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_hosts | default('') | some_custom_filter

# ------------------------------------------------------------- ANDed CLAUSES (a list)
# A list `when:` is clauses ANDed. Reporting one of them as the whole condition
# overstates it; reporting nothing understates it. So the hint lists what is required
# and counts what it could not read.

- name: "Both clauses readable — listed together"
  ansible.builtin.include_tasks: sibling.yml
  when:
    - not (skip_demo | default(false) | bool)
    - demo_mode | default('native') == 'docker'

- name: "One readable clause plus an unreadable one — the other is counted, not dropped"
  # This is NOT "runs unless skip_demo is set": the task also needs demo_result.rc != 0,
  # which cannot be read statically. Saying the first half only would be a lie.
  ansible.builtin.include_tasks: sibling.yml
  when:
    - not (skip_demo | default(false) | bool)
    - demo_result.rc != 0

- name: "NO HINT — every clause unreadable, so there is nothing to say"
  ansible.builtin.include_tasks: sibling.yml
  when:
    - demo_result.rc != 0
    - demo_other.state == demo_wanted.state

# ================================================== WARNINGS — provably broken conditions
- name: "BAD — when-jinja-delimiters: `when:` is already a Jinja expression"
  ansible.builtin.include_tasks: sibling.yml
  when: "{{ skip_demo == false }}"

- name: "BAD — when-item-without-loop: `item` only exists inside a loop"
  ansible.builtin.include_tasks: sibling.yml
  when: item.rc == 0

- name: "BAD — when-assignment: single `=` is a Jinja syntax error at runtime"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode = 'docker'

- name: "BAD — when-unbalanced: the parenthesis never closes"
  ansible.builtin.include_tasks: sibling.yml
  when: not (skip_demo | default(false)

# ====================================== FATAL SINCE ansible-core 2.19 — not yet flagged
# 2.19 made conditionals strict. The rule, verified on core 2.21.2, is narrower than it
# sounds: a clause that is a *string* stripping to empty is refused outright. Absence of a
# clause is not. The editor is silent on all of these, which is what T-117 fixes. The detected
# core version picks the severity rather than whether to speak: an error at 2.19+, a warning
# below it, where the task still runs today but dies the moment you upgrade.

- name: "PENDING — an empty conditional is an error since 2.19"
  ansible.builtin.include_tasks: sibling.yml
  when: ""

- name: "PENDING — whitespace strips to empty, so it is the same error"
  ansible.builtin.include_tasks: sibling.yml
  when: "   "

- name: "PENDING — one empty clause poisons the whole list"
  ansible.builtin.include_tasks: sibling.yml
  when:
    - demo_mode | default('native') == 'native'
    - ""

- name: "BAD — when-not-boolean: a literal cannot evaluate to a boolean"
  # YAML quoting is invisible to Ansible: it strips one layer and evaluates the rest as an
  # expression. `when: "bad"` is the *variable* bad; only this inner-quoted form is a literal.
  ansible.builtin.include_tasks: sibling.yml
  when: "'bad'"

- name: "GOOD — a null when: is absence, not an empty condition, and runs"
  # The trap, and the reason the rule has to test the string rather than the clause count:
  # `when:` is a list field defaulting to empty, so null and [] both mean "no condition"
  # and run fine. Only a string that strips to empty is the error. Verified on 2.21.2.
  ansible.builtin.include_tasks: sibling.yml
  when:

- name: "WRONG TIER — fully wrapped warns today; upstream is subtler than that"
  # Warns right now with the pre-2.19 story ("evaluates twice"). On 2.19+ the value is
  # resolved once and then evaluated: resolving to a string makes it an indirect expression,
  # allowed silently, and only a non-string result is deprecated (for 2.23). Which of the
  # two happens is a runtime type, so neither the current warning nor a flat "deprecated"
  # is honest — T-117.
  ansible.builtin.include_tasks: sibling.yml
  when: "{{ demo_override }}"

# ============================= THE OTHER FOUR EXPRESSION KEYWORDS — not yet linted (T-141)
# `when:` is one of five bare-expression keywords, and the same broken expression is equally
# fatal in any of them. Every case above is an `include_tasks:` because the rules currently
# ride on file references rather than on tasks; neither limit is deliberate.

- name: "PENDING — failed_when: single `=` is the same runtime syntax error"
  ansible.builtin.command: echo hi
  failed_when: demo_mode = 'docker'

- name: "PENDING — until: unbalanced parenthesis, on a task that is not an include"
  ansible.builtin.command: echo hi
  until: not (demo_result.rc == 0
  retries: 3
  delay: 1

- name: "PENDING — assert: that: is a list of bare expressions, like a list when:"
  ansible.builtin.assert:
    that:
      - demo_hosts | length > 0
      - demo_mode = 'docker'

- name: "PENDING — changed_when: `{{ }}` double-evaluates here exactly as it does in when:"
  ansible.builtin.command: echo hi
  changed_when: "{{ demo_result.rc != 0 }}"

- name: "PENDING — changed_when: a literal is not a boolean, fatal since 2.19"
  # The same fault as the `when:` case above, and T-117 built the rule for it — but nothing
  # feeds `changed_when` to the rules yet, so this stays silent until T-141 routes it.
  ansible.builtin.command: echo hi
  changed_when: "'bad'"

- name: "GOOD — changed_when: false is a YAML boolean, not an expression"
  ansible.builtin.command: echo hi
  changed_when: false

- name: "GOOD — changed_when: a quoted expression is still a bare expression"
  # The quoting is YAML's, not Jinja's — the parser hands the rules the same string it
  # would for an unquoted `when:`. A literal and an attribute access in one value, so this
  # is the case that catches a routing bug that mishandles quoting.
  ansible.builtin.command: echo hi
  changed_when: "'CHANGED' in demo_result.stdout"

# ==================================================================== SUPPRESSION AND EDGES

- name: "SILENCED — rule-scoped noqa, same syntax as ansible-lint"
  ansible.builtin.include_tasks: sibling.yml
  when: item.rc == 0  # noqa: when-item-without-loop

- name: "NOT SILENCED — another rule's id leaves this one alone"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode = 'docker'  # noqa: when-item-without-loop

- name: "GOOD — a Jinja keyword argument is not an assignment (T-140)"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_hosts | selectattr("name", "equalto", "web") | map(attribute='port') | first == 80

- name: "GOOD — `item` with a loop is correct, so no warning"
  ansible.builtin.include_tasks: sibling.yml
  loop: [1, 2]
  when: item > 1

- name: "GOOD — the word `item` inside a string literal is not a reference"
  ansible.builtin.include_tasks: sibling.yml
  when: demo_mode | default('x') == 'item'

- name: "GOOD — `item_count` merely starts with `item`, so it must not warn"
  ansible.builtin.include_tasks: sibling.yml
  when: item_count | default(0) | int > 0
