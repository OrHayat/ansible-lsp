---
# Variable go-to-definition: Cmd+click a `{{ variable }}`, or a name inside `when:`, to
# jump to where it's defined IN THIS FILE — play vars, set_fact, or register.
#
# Cross-file sources (role defaults/vars, vars_files, include_vars) and inventory aren't
# indexed yet, so a variable that comes from those won't jump — and that silence is
# deliberate: absence of an in-file definition is not proof the variable is undefined.

- hosts: localhost
  vars:
    service_port: 8080
    base_url: "http://localhost"
    result_name: my_result
  tasks:
    - name: Play vars — Cmd+click base_url or service_port jumps up to the play
      ansible.builtin.debug:
        msg: "{{ base_url }}:{{ service_port }}"

    - name: A registered result defines a variable for the rest of the play
      ansible.builtin.command: echo hi
      register: cmd_result

    - name: Cmd+click cmd_result, here and in the when, jumps to where it was registered
      ansible.builtin.debug:
        msg: "{{ cmd_result.stdout }}"
      when: cmd_result.rc == 0

    - name: A set_fact defines feature_on
      ansible.builtin.set_fact:
        feature_on: true

    - name: A when variable — Cmd+click feature_on jumps to the set_fact above
      ansible.builtin.debug:
        msg: enabled
      when: feature_on | default(false)

    # Block-scoped vars (precedence level 16) — visible to the tasks the block wraps.
    - name: A block binds vars for the tasks inside it
      block:
        - name: Cmd+click retries_left jumps down to the block vars
          ansible.builtin.debug:
            msg: "{{ retries_left }} attempts left"
      vars:
        retries_left: 3

    # Task-scoped vars (level 17) — visible only to this one task.
    - name: A task binds a var scoped to just itself
      ansible.builtin.debug:
        msg: "{{ local_note }}"
      vars:
        local_note: task-scoped only

    # Precedence + ordering: base_url is a play var (level 12) and is redefined below by a
    # set_fact (level 19). Go-to-def and hover are ordering-aware — the FIRST task's use of
    # base_url (above) sees only the play var, because this set_fact hadn't run yet.
    - name: Redefine base_url with a set_fact
      ansible.builtin.set_fact:
        base_url: "https://prod.example.com"

    - name: After the set_fact, base_url resolves to the set_fact
      # Both the play var and the set_fact are in effect here. Hover lists both and marks the
      # set_fact "effective" (level 19 outranks the play var's 12); Cmd+click jumps straight
      # to it, not a picker. The early use above saw only the play var. Ordering + precedence.
      ansible.builtin.debug:
        msg: "{{ base_url }}"

    # Templated mapping KEYS (T-169). Ansible renders a key in exactly two places —
    # `set_fact`'s own args and `set_stats`' `data:` — and its own source calls that "a
    # rare case where key templating is allowed". So the name inside these braces is a
    # real variable use: Cmd+click and hover both work on it, like any other.
    #
    # What we still miss, deliberately: the fact this creates is called `my_result`, and
    # nothing indexes it under that name — working it out means evaluating the template
    # (T-034). A miss beats filing it under `{{ result_name }}`, which no expression could
    # ever reference.
    - name: GOOD Cmd+click result_name inside the key jumps to the play var
      ansible.builtin.set_fact:
        "{{ result_name }}": true

    - name: GOOD the same rendering under set_stats, one level down in data
      ansible.builtin.set_stats:
        data:
          "{{ result_name }}_count": 1

    # NO HINT: the same braces, in a slot that is not a name. Each of the two plugins above
    # renders exactly one mapping — the one whose keys ARE the names it creates. For
    # `set_fact` that is its own args; for `set_stats` it is `data:`, one hop further in,
    # because that plugin has arguments of its own. So it is never about depth: it is about
    # whether this slot names something.
    #
    # Below, the name is `nested_map`. What is inside it is that fact's value — ordinary
    # data — so its key really is spelled `{{ result_name }}`, and measuring it is what
    # comes back out. A hint here would offer a jump to `my_result` on a template Ansible
    # never looks at.
    - name: NO HINT a template nested in a fact's value is data, not a name
      ansible.builtin.set_fact:
        nested_map:
          "{{ result_name }}": stays literal

    # UNDEFINED (var-undefined): this file is a playbook, so no caller can inject vars —
    # a name with zero reachable definitions warns, with the message conceding what we
    # can't see (inventory, facts, -e). In a tasks/role file the same use stays silent.
    - name: Undefined anywhere reachable — warns, conceding inventory
      ansible.builtin.debug:
        msg: "{{ from_inventory }}"

    # GOOD: a reserved name Ansible always injects. Nothing in this workspace defines it and
    # the line above proves `var-undefined` is live in this file, so the silence there is the
    # exemption doing its job — the `ansible_` prefix covers the facts AND the reserved
    # statics (`ansible_playbook_python`, `ansible_config_file`, `ansible_version`, …).
    #
    # Hover it: the value is detected, not guessed — the interpreter behind the `ansible` this
    # editor found (T-051), which the hover says out loud because the play may run on another.
    # `ansible_version` hovers the same way. Every other magic name and every fact hovers
    # nothing, deliberately: we speak only where we hold a value (T-143).
    - name: A reserved ansible_ name — never "undefined", and hover knows its value
      ansible.builtin.debug:
        msg: "{{ ansible_playbook_python }} on {{ ansible_version }}"
