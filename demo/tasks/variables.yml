---
# Variable go-to-definition: Cmd+click a `{{ variable }}`, or a name inside `when:`, to
# jump to where it's defined IN THIS FILE — play vars, set_fact, or register.
#
# Cross-file sources (role defaults/vars, vars_files, include_vars) and inventory aren't
# indexed yet, so a variable that comes from those won't jump — and that silence is
# deliberate: absence of an in-file definition is not proof the variable is undefined.

- hosts: localhost
  vars:
    service_port: 8080
    base_url: "http://localhost"
  tasks:
    - name: Play vars — Cmd+click base_url or service_port jumps up to the play
      ansible.builtin.debug:
        msg: "{{ base_url }}:{{ service_port }}"

    - name: A registered result defines a variable for the rest of the play
      ansible.builtin.command: echo hi
      register: cmd_result

    - name: Cmd+click cmd_result, here and in the when, jumps to where it was registered
      ansible.builtin.debug:
        msg: "{{ cmd_result.stdout }}"
      when: cmd_result.rc == 0

    - name: A set_fact defines feature_on
      ansible.builtin.set_fact:
        feature_on: true

    - name: A when variable — Cmd+click feature_on jumps to the set_fact above
      ansible.builtin.debug:
        msg: enabled
      when: feature_on | default(false)

    # Block-scoped vars (precedence level 16) — visible to the tasks the block wraps.
    - name: A block binds vars for the tasks inside it
      block:
        - name: Cmd+click retries_left jumps down to the block vars
          ansible.builtin.debug:
            msg: "{{ retries_left }} attempts left"
      vars:
        retries_left: 3

    # Task-scoped vars (level 17) — visible only to this one task.
    - name: A task binds a var scoped to just itself
      ansible.builtin.debug:
        msg: "{{ local_note }}"
      vars:
        local_note: task-scoped only

    # Precedence in action: base_url is a play var (level 12) AND is redefined here by
    # set_fact (level 19). At runtime the set_fact wins — but Cmd+click on base_url offers
    # BOTH definitions rather than guessing one, the same way a templated path offers every
    # candidate. Which one actually applies is a runtime fact the editor can't assert.
    - name: Redefine base_url with a set_fact
      ansible.builtin.set_fact:
        base_url: "https://prod.example.com"

    - name: Undefined in this file — no jump, and no warning (it may come from inventory)
      ansible.builtin.debug:
        msg: "{{ from_inventory }}"
