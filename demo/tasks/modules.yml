---
# Module go-to-definition: Cmd+click the FQCN to open the module's .py source.
#
# TEAL + dotted underline = resolves. Plain text = the collection isn't installed
# here (or it's a typo — the server stays quiet either way, since a missing
# collection is not a mistake in your file).
#
# Requires `ansibleLsp.ansiblePath` pointed at an `ansible` package dir whose
# sibling `ansible_collections/` holds these collections. With ansible_source
# (builtins + community.general + ansible.posix cloned) all three below resolve.

# ------------------------------------------------------------- ansible.builtin
- name: Builtin — resolves into the ansible package's modules/
  ansible.builtin.debug:
    msg: hello

# ---------------------------------------------------------- community.general
- name: Collection module — community.general
  community.general.nmcli:
    conn_name: eth0
    type: ethernet
    state: present

- name: Another community.general module
  community.general.pacman:
    name: tmux
    state: present

# --------------------------------------------------------------- ansible.posix
- name: Collection module — ansible.posix
  ansible.posix.firewalld:
    service: https
    state: enabled
    permanent: true

- name: Another ansible.posix module
  ansible.posix.mount:
    path: /mnt/data
    src: /dev/sdb1
    fstype: ext4
    state: mounted

# ---------------------------------------------------------- DELIBERATELY PLAIN
- name: Not installed here — stays plain, no warning
  community.crypto.openssl_certificate:
    path: /etc/ssl/cert.pem
    state: present

# ------------------------------------- ANY EXECUTABLE IS A MODULE (T-093)
# Modules aren't required to be Python — they're files shipped to the target and run.
# Both of these are bash. Ctrl+click opens the .sh source: `sweep` lives in
# demo/library/ (legacy dir, any extension matches), `demo.charlie.pulse` in the
# collection's plugins/modules/ (the FQCN finder globs extensions the same way).
- name: Bash module in library/ — resolves to sweep.sh
  sweep:
    paths: /var/tmp

- name: Bash module in a collection — resolves to pulse.sh
  demo.charlie.pulse:
    interval: 5

# ------------------------------------------------------ ACTION LOOKALIKES (T-094)
# Ansible recognises exactly three spellings of include_tasks: bare,
# `ansible.builtin.`, `ansible.legacy.`. This key merely ENDS in the name — it's an
# ordinary module in a third-party collection, so there must be no "missing file
# x.yml" warning here.
- name: Looks like an include, is a module — stays quiet
  community.general.include_tasks: x.yml

# The FQCN spelling of the real include still IS one: resolves and links the file.
- name: The real include, builtin-FQCN spelling
  ansible.builtin.include_tasks: sibling.yml
