# T-110 batch 1: play- and playbook-level shapes ansible-core refuses to load. Every key
# below is spelled correctly and legal where it sits — what is wrong is the structure around
# it, so the T-107 keyword rules cannot see any of it. Messages measured on ansible-core
# 2.21.2; each BAD line is the exact error `--syntax-check` gives.
- name: user and remote_user are mutually exclusive
  hosts: localhost
  user: alice # BAD: `user` is renamed to `remote_user` in preprocess, and the seat is taken
  remote_user: bob # GOOD on its own — this is the spelling to keep
  tasks:
    - debug: { msg: ok }

- name: an empty hosts is fatal in every spelling
  hosts: # BAD: null, empty string and empty list are all falsy — same error for all three
  tasks:
    - debug: { msg: ok }

- name: a hosts list cannot contain a bare dash
  hosts:
    - web # GOOD
    - # BAD: None, not the empty string — "Hosts list cannot contain values of 'None'"
    - db
  tasks:
    - debug: { msg: ok }

- name: a hosts entry must be a string, not a container
  hosts:
    - { name: web } # BAD: a mapping is an invalid host value
  tasks:
    - debug: { msg: ok }

- name: hosts itself must be a sequence or a string
  hosts: { group: web } # BAD: a mapping is neither
  tasks:
    - debug: { msg: ok }

# Known miss, deliberate: `hosts: 42` is an int to Ansible and fatal with the same
# "must be a sequence or string" error, but the parse tree keeps no scalar style, so we
# cannot tell it from the perfectly good `hosts: "42"`. A miss, never a false error.
- name: a numeric hosts we do not flag
  hosts: 42
  tasks:
    - debug: { msg: ok }

- name: vars_prompt entries have a closed vocabulary
  hosts: localhost
  vars_prompt:
    - name: pw # GOOD: the one required key
      prompt: Password? # GOOD
      private: true # GOOD
      promt: Password? # BAD: unsupported key — one letter from a real one
    - prompt: no name here # BAD: missing 'name' key
  tasks:
    - debug: { msg: ok }

- name: a lone mapping is wrapped into a one-element list, and checked the same
  hosts: localhost
  vars_prompt: # BAD: missing 'name' key — the unwrapped spelling is not a loophole
    prompt: Password?
  tasks:
    - debug: { msg: ok }

- name: imports are expanded at parse time, so a loop has nothing to iterate
  hosts: localhost
  pre_tasks:
    - import_tasks: tasks/sibling.yml
      loop: [1, 2] # BAD: use include_tasks, which the message itself suggests
  tasks:
    - ansible.builtin.import_tasks: tasks/sibling.yml
      with_items: [1] # BAD: `with_*` folds into `loop` before the check, FQCN or not
    - import_role:
        name: notifier
      loop: [1] # BAD: the same rule, one action over
    - import_tasks: tasks/sibling.yml
      loop: # GOOD: a loop written with no value is None, and passes — live-verified
    - include_tasks: tasks/sibling.yml
      loop: [1, 2] # GOOD: the dynamic twin is exactly what the error tells you to use
    - include_role:
        name: notifier
      loop: [1] # GOOD: same
  handlers:
    - name: every task list reaches the same loader
      import_tasks: tasks/sibling.yml
      loop: [1] # BAD: handlers are a task list like any other

# Row 10. `_preprocess_with_loop` refuses a `with_*` only when a loop is ALREADY recorded,
# and the keys are walked in written order — so ansible's rule is asymmetric. We report the
# fatal order with ansible's own message, and the order ansible accepts gets a WARNING of our
# own on its own rule id (`shadowed-loop`), because accepting it is an upstream bug:
# upstream/ansible-duplicate-loop.md.
- name: two loops on one task
  hosts: localhost
  tasks:
    - debug: { msg: "{{ item }}" }
      loop: [1, 2]
      with_items: [a, b] # BAD: a loop was already recorded — "duplicate loop in task: items"

    - debug: { msg: "{{ item }}" }
      with_items: [a, b]
      with_list: [c, d] # BAD: two `with_*` are symmetric, whichever is second raises

    - debug: { msg: "{{ item }}" }
      with_items: [a, b] # WARN (shadowed-loop): ansible runs this, and that is the bug. The
      # with_items VALUE is discarded, but the `items` lookup it registered is not — so the
      # `loop:` below iterates flattened, differently from the same `loop:` written alone.
      loop: [1, 2]

    - debug: { msg: "{{ item }}" }
      loop: # GOOD: a valueless loop is None, so it never counts as the first loop
      with_items: [a, b]

# Row 20. The next line of the same function: a `with_*` written with no value at all. Only
# a MISSING value counts — `with_items: ""` and `with_items: []` both run clean upstream.
- name: a loop keyword with nothing to loop over
  hosts: localhost
  tasks:
    - debug: { msg: x }
      with_items: # BAD: "you must specify a value when using with_items"

    - debug: { msg: x }
      with_dict: # BAD: the message names the key as written, not the lookup

    - debug: { msg: x }
      with_items: "" # GOOD: an empty string is not None, and ansible runs it

    - debug: { msg: x }
      with_items: [] # GOOD: an empty list is a loop over nothing, not a missing value

# Row 21 and T-155, both hanging off one read of `loop_control:`. Row 21 is stricter than the
# `loop:` guard: a valueless `loop_control:` is fatal, and so is a templated scalar — that is
# what "cannot be a variable itself" means. T-155 is ours: a well-formed block with no loop to
# control is inert, and ansible runs it clean with no warning at all.
- name: loop_control, malformed and dead
  hosts: localhost
  vars:
    a_control: { loop_var: it }
  tasks:
    - debug: { msg: x }
      loop: [1]
      loop_control: nonsense # BAD: not a mapping

    - debug: { msg: x }
      loop: [1]
      loop_control: "{{ a_control }}" # BAD: it may CONTAIN variables, but not BE one

    - debug: { msg: x }
      loop: [1]
      loop_control: # BAD: unlike `loop:`, a valueless loop_control is fatal

    - debug: { msg: x }
      loop_control: # WARN (dead-loop-control): no loop:, no with_* — every key here is inert
        loop_var: it
        label: "{{ it }}"

    - include_tasks: tasks/sibling.yml
      loop_control: { loop_var: it } # WARN: includes take loop_control, and it is just as dead

    - debug: { msg: "{{ it }}" } # GOOD: a loop to control, so the block does something
      loop: [1]
      loop_control: { loop_var: it }

    - block: # GOOD here: `loop_control` on a Block is T-107's invalid-attribute error,
        - debug: { msg: x } # not ours — one fault, one rule.
      loop_control: { loop_var: it }

# Row 7. `Block.is_block` is any of `block`/`rescue`/`always` (`block.py:91-98`), so a mapping
# with a `rescue:` and no `block:` is a malformed BLOCK, not a task calling a module named
# `rescue`. The guard that rejects it is `if value and not self.block` (`block.py:138-142`) —
# Python truthiness on both sides, which is what makes the empty cases below go the way they do.
- name: rescue and always need a block to attach to
  hosts: localhost
  tasks:
    - rescue: # BAD: 'rescue' keyword cannot be used without 'block'
        - debug: { msg: r }

    - always: # BAD: 'always' keyword cannot be used without 'block'
        - debug: { msg: a }

    - block: [] # BAD: an EMPTY block is falsy, so it counts as no block at all
      rescue:
        - debug: { msg: r }

    - rescue: [] # GOOD: an empty rescue is falsy on the other side — nothing to complain of
    - always: [] # GOOD: likewise

    - rescue: # GOOD here: a null value dies earlier in `_load`, with a different message
        # ("A malformed block was encountered while loading rescue"), so it is not row 7's.

    - block: # GOOD: the ordinary shape, and it nests to any depth — measured legal
        - block:
            - debug: { msg: x }
      rescue:
        - block:
            - debug: { msg: r }

# Row 1. `use_handlers` is threaded through both loaders, but `Play._load_handlers` reaches
# `load_list_of_blocks` (`play.py:205`), which loads a top-level entry as a Block without ever
# consulting the flag. Only `load_list_of_tasks` checks it (`helpers.py:104-106`), one level in.
# So the boundary is not the `handlers:` list — it is the inside of a handler.
- name: a block is fine as a handler, and refused inside one
  hosts: localhost
  tasks:
    - debug: { msg: t }
      changed_when: true
      notify: [h1, h2, h3, h4]
  handlers:
    - name: h1 # GOOD: a top-level block under handlers: loads clean, measured exit 0.
      block: # (It is not *harmless* — the handler's name is destroyed, so notify: can
        - debug: { msg: x } # never match it. Ansible only says so at run time; a T-099 candidate, not ours.)

    - name: h2
      block:
        - block: # BAD: one level in, load_list_of_tasks refuses it
            - debug: { msg: x }

    - name: h3
      block:
        - debug: { msg: x }
      rescue:
        - block: # BAD: all three containers of a handler reach the same loader
            - debug: { msg: r }

    - name: h4
      block:
        - debug: { msg: x }
      always:
        - block: # BAD: same
            - debug: { msg: a }

- name: outside handlers the same nesting is ordinary Ansible
  hosts: localhost
  pre_tasks:
    - block: # GOOD: nested blocks are legal in every non-handler list, at any depth
        - block:
            - debug: { msg: x }
  tasks:
    - block: # GOOD
        - block:
            - block:
                - debug: { msg: x }

# BAD: a playbook entry must be a mapping. The other three faults at this site — an empty
# file, a top-level mapping, a list with no plays — need to know the file IS a playbook,
# which only the command line says, so we stay quiet on those rather than false-positive
# on every vars file.
- just-a-string
