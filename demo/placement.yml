# T-110 batch 1: play- and playbook-level shapes ansible-core refuses to load. Every key
# below is spelled correctly and legal where it sits — what is wrong is the structure around
# it, so the T-107 keyword rules cannot see any of it. Messages measured on ansible-core
# 2.21.2; each BAD line is the exact error `--syntax-check` gives.
- name: user and remote_user are mutually exclusive
  hosts: localhost
  user: alice # BAD: `user` is renamed to `remote_user` in preprocess, and the seat is taken
  remote_user: bob # GOOD on its own — this is the spelling to keep
  tasks:
    - debug: { msg: ok }

- name: an empty hosts is fatal in every spelling
  hosts: # BAD: null, empty string and empty list are all falsy — same error for all three
  tasks:
    - debug: { msg: ok }

- name: a hosts list cannot contain a bare dash
  hosts:
    - web # GOOD
    - # BAD: None, not the empty string — "Hosts list cannot contain values of 'None'"
    - db
  tasks:
    - debug: { msg: ok }

- name: a hosts entry must be a string, not a container
  hosts:
    - { name: web } # BAD: a mapping is an invalid host value
  tasks:
    - debug: { msg: ok }

- name: hosts itself must be a sequence or a string
  hosts: { group: web } # BAD: a mapping is neither
  tasks:
    - debug: { msg: ok }

# Known miss, deliberate: `hosts: 42` is an int to Ansible and fatal with the same
# "must be a sequence or string" error, but the parse tree keeps no scalar style, so we
# cannot tell it from the perfectly good `hosts: "42"`. A miss, never a false error.
- name: a numeric hosts we do not flag
  hosts: 42
  tasks:
    - debug: { msg: ok }

- name: vars_prompt entries have a closed vocabulary
  hosts: localhost
  vars_prompt:
    - name: pw # GOOD: the one required key
      prompt: Password? # GOOD
      private: true # GOOD
      promt: Password? # BAD: unsupported key — one letter from a real one
    - prompt: no name here # BAD: missing 'name' key
  tasks:
    - debug: { msg: ok }

- name: a lone mapping is wrapped into a one-element list, and checked the same
  hosts: localhost
  vars_prompt: # BAD: missing 'name' key — the unwrapped spelling is not a loophole
    prompt: Password?
  tasks:
    - debug: { msg: ok }

- name: imports are expanded at parse time, so a loop has nothing to iterate
  hosts: localhost
  pre_tasks:
    - import_tasks: tasks/sibling.yml
      loop: [1, 2] # BAD: use include_tasks, which the message itself suggests
  tasks:
    - ansible.builtin.import_tasks: tasks/sibling.yml
      with_items: [1] # BAD: `with_*` folds into `loop` before the check, FQCN or not
    - import_role:
        name: notifier
      loop: [1] # BAD: the same rule, one action over
    - import_tasks: tasks/sibling.yml
      loop: # GOOD: a loop written with no value is None, and passes — live-verified
    - include_tasks: tasks/sibling.yml
      loop: [1, 2] # GOOD: the dynamic twin is exactly what the error tells you to use
    - include_role:
        name: notifier
      loop: [1] # GOOD: same
  handlers:
    - name: every task list reaches the same loader
      import_tasks: tasks/sibling.yml
      loop: [1] # BAD: handlers are a task list like any other

# Row 10. `_preprocess_with_loop` refuses a `with_*` only when a loop is ALREADY recorded,
# and the keys are walked in written order — so ansible's rule is asymmetric. We report the
# fatal order with ansible's own message, and the order ansible accepts gets a WARNING of our
# own on its own rule id (`shadowed-loop`), because accepting it is an upstream bug:
# upstream/ansible-duplicate-loop.md.
- name: two loops on one task
  hosts: localhost
  tasks:
    - debug: { msg: "{{ item }}" }
      loop: [1, 2]
      with_items: [a, b] # BAD: a loop was already recorded — "duplicate loop in task: items"

    - debug: { msg: "{{ item }}" }
      with_items: [a, b]
      with_list: [c, d] # BAD: two `with_*` are symmetric, whichever is second raises

    - debug: { msg: "{{ item }}" }
      with_items: [a, b] # WARN (shadowed-loop): ansible runs this, and that is the bug. The
      # with_items VALUE is discarded, but the `items` lookup it registered is not — so the
      # `loop:` below iterates flattened, differently from the same `loop:` written alone.
      loop: [1, 2]

    - debug: { msg: "{{ item }}" }
      loop: # GOOD: a valueless loop is None, so it never counts as the first loop
      with_items: [a, b]

# Row 20. The next line of the same function: a `with_*` written with no value at all. Only
# a MISSING value counts — `with_items: ""` and `with_items: []` both run clean upstream.
- name: a loop keyword with nothing to loop over
  hosts: localhost
  tasks:
    - debug: { msg: x }
      with_items: # BAD: "you must specify a value when using with_items"

    - debug: { msg: x }
      with_dict: # BAD: the message names the key as written, not the lookup

    - debug: { msg: x }
      with_items: "" # GOOD: an empty string is not None, and ansible runs it

    - debug: { msg: x }
      with_items: [] # GOOD: an empty list is a loop over nothing, not a missing value

# Row 21 and T-155, both hanging off one read of `loop_control:`. Row 21 is stricter than the
# `loop:` guard: a valueless `loop_control:` is fatal, and so is a templated scalar — that is
# what "cannot be a variable itself" means. T-155 is ours: a well-formed block with no loop to
# control is inert, and ansible runs it clean with no warning at all.
- name: loop_control, malformed and dead
  hosts: localhost
  vars:
    a_control: { loop_var: it }
  tasks:
    - debug: { msg: x }
      loop: [1]
      loop_control: nonsense # BAD: not a mapping

    - debug: { msg: x }
      loop: [1]
      loop_control: "{{ a_control }}" # BAD: it may CONTAIN variables, but not BE one

    - debug: { msg: x }
      loop: [1]
      loop_control: # BAD: unlike `loop:`, a valueless loop_control is fatal

    - debug: { msg: x }
      loop_control: # WARN (dead-loop-control): no loop:, no with_* — every key here is inert
        loop_var: it
        label: "{{ it }}"

    - include_tasks: tasks/sibling.yml
      loop_control: { loop_var: it } # WARN: includes take loop_control, and it is just as dead

    - debug: { msg: "{{ it }}" } # GOOD: a loop to control, so the block does something
      loop: [1]
      loop_control: { loop_var: it }

    - block: # GOOD here: `loop_control` on a Block is T-107's invalid-attribute error,
        - debug: { msg: x } # not ours — one fault, one rule.
      loop_control: { loop_var: it }

# Row 7. `Block.is_block` is any of `block`/`rescue`/`always` (`block.py:91-98`), so a mapping
# with a `rescue:` and no `block:` is a malformed BLOCK, not a task calling a module named
# `rescue`. The guard that rejects it is `if value and not self.block` (`block.py:138-142`) —
# Python truthiness on both sides, which is what makes the empty cases below go the way they do.
- name: rescue and always need a block to attach to
  hosts: localhost
  tasks:
    - rescue: # BAD: 'rescue' keyword cannot be used without 'block'
        - debug: { msg: r }

    - always: # BAD: 'always' keyword cannot be used without 'block'
        - debug: { msg: a }

    - block: [] # BAD: an EMPTY block is falsy, so it counts as no block at all
      rescue:
        - debug: { msg: r }

    - rescue: [] # GOOD: an empty rescue is falsy on the other side — nothing to complain of
    - always: [] # GOOD: likewise

    - rescue: # GOOD here: a null value dies earlier in `_load`, with a different message
        # ("A malformed block was encountered while loading rescue"), so it is not row 7's.

    - block: # GOOD: the ordinary shape, and it nests to any depth — measured legal
        - block:
            - debug: { msg: x }
      rescue:
        - block:
            - debug: { msg: r }

# Row 1. `use_handlers` is threaded through both loaders, but `Play._load_handlers` reaches
# `load_list_of_blocks` (`play.py:205`), which loads a top-level entry as a Block without ever
# consulting the flag. Only `load_list_of_tasks` checks it (`helpers.py:104-106`), one level in.
# So the boundary is not the `handlers:` list — it is the inside of a handler.
- name: a block is fine as a handler, and refused inside one
  hosts: localhost
  tasks:
    - debug: { msg: t }
      changed_when: true
      notify: [h1, h2, h3, h4]
  handlers:
    - name: h1 # GOOD: a top-level block under handlers: loads clean, measured exit 0.
      block: # (It is not *harmless* — the handler's name is destroyed, so notify: can
        - debug: { msg: x } # never match it. Ansible only says so at run time; a T-099 candidate, not ours.)

    - name: h2
      block:
        - block: # BAD: one level in, load_list_of_tasks refuses it
            - debug: { msg: x }

    - name: h3
      block:
        - debug: { msg: x }
      rescue:
        - block: # BAD: all three containers of a handler reach the same loader
            - debug: { msg: r }

    - name: h4
      block:
        - debug: { msg: x }
      always:
        - block: # BAD: same
            - debug: { msg: a }

- name: outside handlers the same nesting is ordinary Ansible
  hosts: localhost
  pre_tasks:
    - block: # GOOD: nested blocks are legal in every non-handler list, at any depth
        - block:
            - debug: { msg: x }
  tasks:
    - block: # GOOD
        - block:
            - block:
                - debug: { msg: x }

# Row 2. Refused before the task is loaded at all (`helpers.py:245-247`), which is why it beats
# the loop rules below it. Unlike row 1 it applies at a handler's top level too: a plain entry
# there is wrapped into an implicit block and re-loaded through `load_list_of_tasks`, while a
# block entry is loaded directly and skips the check. The message quotes the key AS WRITTEN.
- name: role includes cannot be handlers, in any core spelling
  hosts: localhost
  tasks:
    - debug: { msg: t }
  handlers:
    - name: h1
      include_role: { name: notifier } # BAD: Using 'include_role' as a handler is not supported.

    - name: h2
      ansible.builtin.import_role: { name: notifier } # BAD: quoted with the FQCN, as written

    - name: h3
      block:
        - include_role: { name: notifier } # BAD: inside a handler as well as at its top level

    - name: h4
      include_role: { name: notifier } # BAD: row 2 wins — it is raised before the task loads
      loop: [1]
      with_items: [2]

    - name: h5
      include_tasks: tasks/sibling.yml # GOOD: task includes are fine as handlers, role ones are not

    - name: h6
      community.general.include_role: { name: notifier } # GOOD here: a collection's own module,
      # not in _ACTION_ALL_PROPER_INCLUDE_IMPORT_ROLES — upstream fails it as an unresolvable
      # action instead, which is a different rule's to give.

- name: and outside handlers a role include is an ordinary task
  hosts: localhost
  tasks:
    - include_role: { name: notifier } # GOOD
    - import_role: { name: notifier } # GOOD

# Rows 6 and 25, the two `meta:` refusals. 6a and 25 are handler-position rules like rows 1-2.
# 6b is the other half of the same upstream `if`: `role is None`. We never prove a statement IS
# in a role — only that a play's own task list is a position where it provably is NOT, which
# holds even when the play also has `roles:` (measured). Row 25 is the one raised at run time
# (`strategy/__init__.py:883`) rather than at load, so `--syntax-check` alone would miss it.
# Note on `end_role`: there is no GOOD case for it anywhere in THIS file, and that is not an
# omission. `meta: end_role` ends the enclosing role early, so it is legal only inside a role's
# own `tasks/` files — a different file entirely. The word "tasks" collides and hides that: a
# play has a `tasks:` KEY (never in a role), a role has a `tasks/` DIRECTORY (always in one).
# Blocks are transparent to this — measured legal at any depth inside a role, fatal at any
# depth in a play — which is why `Pos::PlayTasks` survives `inside()`.
- name: meta words that cannot be handlers
  hosts: localhost
  tasks:
    - debug: { msg: t }
    - meta: flush_handlers # GOOD: this is what flush_handlers is FOR
    - meta: clear_facts # GOOD
    - meta: end_role # BAD: this `tasks:` is a PLAY's, so there is no role to end
    - block:
        - meta: end_role # BAD: a block does not put you in a role — still a play task list
  handlers:
    - name: h1
      meta: end_role # BAD: Cannot execute 'end_role' from a handler — `use_handlers`
      # short-circuits before the role check, so this fires in a role's handlers/ file too

    - name: h2
      meta: flush_handlers # BAD: flush_handlers cannot be used as a handler

    - name: h3
      block:
        - ansible.builtin.meta: flush_handlers # BAD: either handler depth, any core spelling

    - name: h4
      meta: clear_facts # GOOD: only end_role and flush_handlers are refused here

# Rows 11 and 24, both about `local_action:`. Row 11 is raised by `ModuleArgsParser`, which
# `load_list_of_tasks` calls BEFORE `Task.load` — so it beats the loop rules, measured. Row 24
# is ours: `local_action` sets `delegate_to = 'localhost'` (`mod_args.py:325`) over whatever the
# author wrote at 303, and ansible says nothing. Proven with a control — `delegate_to: other`
# alone runs `ok: [localhost -> other]`, and the arrow disappears once `local_action` is there.
- name: local_action collides with two other keys
  hosts: localhost
  tasks:
    - action: debug msg=x
      local_action: debug msg=y # BAD: action and local_action are mutually exclusive

    - action: debug msg=x
      local_action: debug msg=y # BAD: the same, and it beats the duplicate loop below it
      loop: [1]
      with_items: [2]

    - local_action: debug msg=y
      delegate_to: other # WARN (discarded-delegate-to): local_action already delegated to
      # localhost, so this host is never used — the task runs locally and says nothing

    - local_action: # GOOD here: a valueless local_action is `unexpected parameter type in
      delegate_to: other # action: <class 'NoneType'>` upstream — a different rule's message

    - debug: { msg: y }
      delegate_to: other # GOOD: the ordinary spelling, and it really does delegate

    - action: debug msg=x # GOOD: either key alone is fine
    - local_action: debug msg=y # GOOD

# Row 12. No module resolution is involved, which is the surprise: `load_list_of_tasks` calls
# `parse(skip_action_validation=True)` (`helpers.py:121`), so EVERY key that is not a task
# attribute is an action candidate — whether or not it names a real module. The resolving parse
# is a second one inside `Task.load`, and it only ever sees a single candidate, which is why a
# lone unknown key gets `couldn't resolve module/action` instead of this.
- name: two module keys on one task
  hosts: localhost
  tasks:
    - debug: { msg: x }
      frobnicate: y # BAD: conflicting action statements: debug, frobnicate — and `frobnicate`
      # resolves to nothing at all, which is exactly the point

    - ansible.builtin.debug: { msg: x }
      nmae: oops # BAD: a typo is an action candidate too, so upstream reports the conflict
      # rather than an unknown attribute. Quoted as written, FQCN included.

    - foo: [1, 2]
      bar: x # GOOD here: the FIRST candidate's value is normalized before the second is even
      # looked at, so a list raises `unexpected parameter type in action` — a different rule's

    - debug: { msg: x }
      when: true # GOOD: task attributes are filtered out of the candidate set
      register: r
      with_items: [1]
      static: yes # GOOD for this rule — `'static' is not a valid attribute for a Task` is
      # T-107's message, and it is what ansible gives here too

# Row 22 is the far end of the same walk (`mod_args.py:368`): no candidate at all. `action:`
# and `local_action:` are task attributes so they never appear as candidates, but each sets the
# action in its own branch above the walk — measured, both load clean alone.
- name: tasks with nothing to run
  hosts: localhost
  tasks:
    - name: a name and a condition, and no module # BAD: no module/action detected in task.
      when: true

    - with_items: [1] # BAD: a loop keyword is not a module either

    - action: debug msg=x # GOOD: `action:` supplies the module
    - local_action: debug msg=x # GOOD: so does `local_action:`

# Row 9. `PlaybookInclude.preprocess_data` gathers the spellings as a SET and demands exactly
# one, so any two of the three collide — and the names are printed SORTED, not in the order
# they were written. Both measured.
- import_playbook: tasks/sibling.yml
  ansible.builtin.import_playbook: tasks/sibling.yml # BAD: Found conflicting import_playbook
  # actions: ansible.builtin.import_playbook, import_playbook

# `import_playbook:` inside a task list. The message here is OURS, on its own rule id: ansible
# does fail, but only at run time (exit 2) and with a message about parameters that never
# mentions position — a raw path gives `Action 'ansible.builtin.import_playbook' does not
# support raw params.`, a `{file: ...}` mapping gives `module (import_playbook) is missing...`.
# There is no single upstream message to borrow, and neither would tell the author anything.
- name: import_playbook belongs at playbook level
  hosts: localhost
  tasks:
    - import_playbook: tasks/sibling.yml # WARN-tier ERROR (misplaced-import-playbook)
    - block:
        - ansible.builtin.import_playbook: tasks/sibling.yml # BAD: nested too, any spelling

# GOOD: the same keyword one level out, where it belongs — a playbook-level entry. `play`
# peels these off before any task rule sees them, which is why this stays silent.
- import_playbook: tasks/sibling.yml

# BAD: a playbook entry must be a mapping. The other three faults at this site — an empty
# file, a top-level mapping, a list with no plays — need to know the file IS a playbook,
# which only the command line says, so we stay quiet on those rather than false-positive
# on every vars file.
- just-a-string
