---
# include_vars loads a vars file (or directory) partway through a play — unlike vars_files,
# which loads at play start. The tool resolves the explicit path and indexes its keys, so a
# use of one of them jumps into the loaded file.

- name: include_vars demo
  hosts: localhost
  vars:
    env: prod
  tasks:
    - name: Load DB settings mid-play
      ansible.builtin.include_vars: vars/db_settings.yml

    # Cmd+click db_pool_size -> jumps to vars/db_settings.yml; hover shows
    #   include_vars · vars/db_settings.yml:4 = 20
    - name: Use a variable that include_vars defined
      ansible.builtin.debug:
        msg: "pool size {{ db_pool_size }}, timeout {{ db_timeout }}"

    # The block form with an explicit file parameter resolves the same way.
    - name: Same, as a block form
      ansible.builtin.include_vars:
        file: vars/db_settings.yml

    # MISSING (missing-file): the target doesn't exist, so this warns — the include_vars
    # path is checked for existence, just like include_tasks / import_playbook / a role.
    - name: Load invalid file
      ansible.builtin.include_vars: vars/not_exists.yml

    # KNOWN-VALUE templating (T-056): env is a play var = prod, so {{ env }} is substituted
    # and this NAVIGATES to vars/prod.yml — Ctrl+click offers it. Still no warning: a -e
    # override could change env, so it's navigation only, never a missing-file complaint.
    - name: Templated but knowable — navigates to vars/prod.yml
      ansible.builtin.include_vars: "vars/{{ env }}.yml"

    # UNDEFINED (var-undefined): nothing reachable defines `region`, so the *variable*
    # warns — on the `{{ region }}` token, wording conceding inventory/facts/-e. The
    # *path* still never warns: which file it names is unknowable. `# noqa: var-undefined`
    # silences it for vars that genuinely arrive at runtime.
    - name: Templated and unknown — the variable warns, the path stays quiet
      ansible.builtin.include_vars: "vars/{{ region }}.yml"

    # DIR form: loads every vars file under the directory, recursively. Ansible computes
    # exactly ONE path (`_set_root_dir`) — outside a role, this file's dir + `vars` —
    # never a search list. Ctrl+click offers the files the directory loads (an editor
    # can't open a directory); an empty directory is legal and stays quiet.
    - name: Load a whole directory of vars
      ansible.builtin.include_vars:
        dir: vars

    # The free-form line is parsed like Ansible parses it: `=` tokens are options, so
    # this is the dir form too, namespaced under `db`.
    - name: Same, k=v style with a namespace
      ansible.builtin.include_vars: dir=vars name=db

    # MISSING (missing-dir): the one computed path doesn't exist, so this warns — the
    # dir form is existence-checked at the exact path Ansible would walk.
    - name: Load a directory that doesn't exist
      ansible.builtin.include_vars:
        dir: no_such_vars
