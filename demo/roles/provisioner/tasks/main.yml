---
# A role that sets a fact (precedence level 19). Because the playbook includes this role,
# provisioner_ready is reachable from there — Cmd+click on it in the playbook jumps here.
- name: Mark the provisioner ready
  ansible.builtin.set_fact:
    provisioner_ready: true

# DEPENDENCY SCOPE: this role's meta/main.yml depends on network-base, which therefore
# runs first — so its variables are already defined here. Cmd+click jumps INTO the
# dependency; without the meta edge these would read as undefined.

- name: Use a DEFAULT defined by the dependency (network-base/defaults/main.yml)
  ansible.builtin.debug:
    msg: "mtu is {{ network_mtu }}"

- name: Use a FACT the dependency set (network-base/tasks/main.yml set_fact)
  ansible.builtin.debug:
    msg: "network ready: {{ network_ready }}"
