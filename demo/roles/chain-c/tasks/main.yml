- ansible.builtin.debug:
    msg: "chain-c ran"

# GOOD (T-206): resolves to vars/settings.yml, NOT the same-named tasks/settings.yml
# sitting right beside this file. A role's vars/ dir is searched first.
- name: Load extra vars from this role's vars/ dir
  ansible.builtin.include_vars: settings.yml

# HINT (redundant-role-vars-include): this re-loads vars/main.yml, which Ansible already
# loaded for the role. Legal, and it runs — so a hint, not a warning.
#
# Two costs, both invisible here: it executes once per host (~5ms each, measured), and it
# lands at include_vars precedence (18), which outranks block vars (16) and task vars (17),
# so a caller's override silently stops working.
#
# GOOD (T-207) on the same line: hover `chain_c_tuning` below and you get TWO definitions of
# one file — `include_vars` leading and marked effective, `role var` under it.
- name: Re-load this role's own vars (redundant, and it raises their precedence)
  ansible.builtin.include_vars: main.yml

- name: Read the twice-loaded value
  ansible.builtin.debug:
    msg: "tuning {{ chain_c_tuning }}"
