---
# Per-host variables with NO inventory files at all. A registered variable exists only on
# the hosts where its task actually ran — and what decides that is the `when:` right here in
# the playbook, which the tool can read. So "web01 but not web02" comes straight from the
# file, not from any inventory.

- name: Conditional register demo
  hosts: all
  tasks:
    - name: Check nginx — only web01 runs this, so only web01 registers nginx_state
      ansible.builtin.command: systemctl is-active nginx
      register: nginx_state
      when: inventory_hostname == 'web01'

    # Hover nginx_state below: it shows the register AND the guard —
    #   register · conditional_register.yml:12  (only when inventory_hostname == 'web01')
    # That "only when" is the honest per-host story, with no inventory involved. On web02 the
    # task was skipped, so nginx_state carries a skipped result there rather than a real value.
    - name: Use the registered result — meaningful only where the check ran
      ansible.builtin.debug:
        msg: "nginx is {{ nginx_state.stdout }}"
      when: inventory_hostname == 'web01'

    # WARNING (var-uncovered-when): this uses nginx_state on web01 OR web02, but it was only
    # registered on web01 above. On web02 the register never ran, so nginx_state is undefined
    # there. The tool reasons about the when: conditions — no inventory needed — and flags:
    #   "nginx_state may be undefined when inventory_hostname == 'web02'"
    - name: Broader use than the register covers — this should warn
      ansible.builtin.debug:
        msg: "nginx is {{ nginx_state.stdout }}"
      when: inventory_hostname == 'web01' or inventory_hostname == 'web02'

    # To FIX it, register on web02 too (uncomment to make the warning disappear):
