# T-062: the second half of the directory. Named `db.ini` — nothing points at it and its
# name says nothing about inventories, which is exactly why picking the FOLDER is the only
# way to get it without naming every file by hand.
#
# `.ini` is read. That is measured, and it is the surprising half: `.ini` sits in
# MODULE_IGNORE_EXTS, not INVENTORY_IGNORE_EXTS, so it survives here while README.md
# beside it does not.

[db]
db01 host_line_ip=10.1.0.21

[db:vars]
db_port=5432
