# T-062: a directory inventory. `-i demo/inventories/prod` reads THIS FILE and db.ini, as
# two sources merged into one inventory — the folder is the unit, not the file.
#
# Pick the folder in "Ansible LSP: Select Inventory" and the panel lists what it resolves
# to, including what it drops. That listing comes from the same function the reader uses,
# so it cannot advertise a file that is never loaded.

[webservers]
web01 host_line_ip=10.1.0.11
web02 host_line_ip=10.1.0.12

[webservers:vars]
ntp_server=10.1.0.1
app_tier=prod-dir
