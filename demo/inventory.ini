# Inventory for the multi-host demo (multi_host_vars.yml). Defines which hosts are in which
# group — that mapping is what decides which group_vars apply to which host at runtime.
#
# The LSP does not read THIS file, but not because inventories are unreadable any more —
# T-062 made them readable, and ansible.cfg names inventory-lab.yml as the one in effect.
# This file is simply not the chosen source. Pick it with "Ansible LSP: Select Inventory"
# and it becomes the one that answers, including which hosts exist.
[webservers]
web01
web02

[db]
db01
