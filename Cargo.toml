[workspace]
resolver = "3"
members = ["crates/ansible-core", "crates/ansible-lsp", "crates/board"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# The YAML parser. A pure-Rust libyaml port — lenient like Ansible (PyYAML/libyaml), so it
# accepts real playbooks strict YAML 1.2 rejects. Confined to parse_libyaml.rs, the only
# module allowed to touch its API, so a version bump stays a one-file change.
libyaml-safer = "0.3"
# `files_matching` / `ignore_files` are Python-re patterns. Full `regex` (not -lite) for
# Unicode-aware \d/\w/case-folding like Python's; lookaround/backrefs are still absent in
# both. that gap would need fancy-regex, and no real filename pattern uses them.
regex = "1"
# Not for serialising anything: Ansible tries `json.loads` on every file before YAML
# (`parsing/utils/yaml.py:41`), and "did a JSON parser accept this" is the only test that
# reproduces which files skip its duplicate-key check. See `parse::Loader` (T-102).
serde_json = "1"
