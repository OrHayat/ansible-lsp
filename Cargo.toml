[workspace]
resolver = "3"
members = ["crates/ansible-core", "crates/ansible-lsp", "crates/board"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# The YAML parser. A pure-Rust libyaml port — lenient like Ansible (PyYAML/libyaml), so it
# accepts real playbooks strict YAML 1.2 rejects. Confined to parse_libyaml.rs, the only
# module allowed to touch its API, so a version bump stays a one-file change.
libyaml-safer = "0.3"
# `files_matching` / `ignore_files` are Python-re patterns. Full `regex` (not -lite) for
# Unicode-aware \d/\w/case-folding like Python's; lookaround/backrefs are still absent in
# both. that gap would need fancy-regex, and no real filename pattern uses them.
regex = "1"
# Jinja identifiers are Python identifiers — `lexer.py` builds `name_re` from a generated
# Unicode table and then re-checks with `str.isidentifier()`. That is XID_Start/XID_Continue,
# which this crate is exactly (and only) a table for. `\w`-style matching gets `föö` and `き`
# right and `℘`, `℮` and a trailing `·` wrong, which is why jinja generates a table too. T-188.
unicode-ident = "1"
# Not for serialising anything: Ansible tries `json.loads` on every file before YAML
# (`parsing/utils/yaml.py:41`), and "did a JSON parser accept this" is the only test that
# reproduces which files skip its duplicate-key check. See `parse::Loader` (T-102).
serde_json = "1"

# Until simonask/libyaml-safer takes the fix. `read_line_break` panicked at end of input
# instead of doing nothing, so a block scalar whose last line has no trailing newline aborted
# the process — valid YAML that libyaml, PyYAML and Ansible all accept. T-142.
[patch.crates-io]
libyaml-safer = { git = "https://github.com/OrHayat/libyaml-safer", rev = "40e4021" }
